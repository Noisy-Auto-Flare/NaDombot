services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homework_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      USE_SQLITE: "true"
      SQLITE_PATH: /app/data/db.sqlite
      NODE_ENV: ${NODE_ENV:-production}
      MULTIPROFILE_ENABLED: ${MULTIPROFILE_ENABLED:-0}
      MULTIPROFILE_FORCE: ${MULTIPROFILE_FORCE:-}
      AUDIENCE_CONFIG_PATH: /app/config/audience.json
    volumes:
      - sqlite_data:/app/data
      - ./config/audience.json:/app/config/audience.json:ro
    networks:
      - homework_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  sqlite_data:

networks:
  homework_network:
    driver: bridge
