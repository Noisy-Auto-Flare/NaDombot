services:
  # Сервис базы данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: homework_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-homework_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # Постоянное хранилище для данных БД
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Опционально: открываем порт для внешнего доступа
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homework_network
    restart: unless-stopped

  # Сервис Telegram бота
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homework_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-homework_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homework_network
    restart: unless-stopped

volumes:
  # Именованный том для данных PostgreSQL
  postgres_data:

networks:
  homework_network:
    driver: bridge
