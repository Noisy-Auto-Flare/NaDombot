services:
  # PostgreSQL — настройки для малой нагрузки на VPS
  postgres:
    image: postgres:15-alpine
    container_name: homework_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-homework_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # Именованный том — данные не теряются при docker compose up/down (не использовать down -v!)
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    mem_limit: 256m
    memswap_limit: 128m
    shm_size: 64mb
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - max_connections=20
      - -c
      - wal_buffers=64kB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=off
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - jit=off
      - -c
      - autovacuum_naptime=5min
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - homework_network
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homework_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-homework_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homework_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  homework_network:
    driver: bridge
