services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homework_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      USE_SQLITE: "true"
      SQLITE_PATH: /app/data/db.sqlite
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - sqlite_data:/app/data
    networks:
      - homework_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  sqlite_data:

networks:
  homework_network:
    driver: bridge
